<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Pindutan — pick a game</title>
<!-- HUB-MENU -->
<style>
  :root {
    --bg: #04060c;
    --panel: #08101c;
    --line: rgba(140, 170, 210, 0.16);
    --ink: #e8f1ff;
    --mut: #7f93ad;
    --cyan: #3dd6f5;
    --lime: #4ade80;
    --amber: #ffb020;
    --violet: #a855f7;
    --red: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 26px 18px calc(30px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 70% at 50% 0%, rgba(61, 214, 245, 0.10), transparent 60%), var(--bg);
    color: var(--ink);
    font: 500 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* the same sky the index uses */
  .grid, .horizon { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .grid {
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .horizon {
    top: -34vh; left: 50%; transform: translateX(-50%);
    width: 150vw; height: 58vh; border-radius: 50%;
    background: radial-gradient(ellipse at bottom, rgba(0, 82, 136, 0.22) 0%, transparent 70%);
    border-bottom: 1px solid rgba(56, 189, 248, 0.16);
  }
  main { position: relative; z-index: 1; width: min(460px, 100%); text-align: center; }
  .mark {
    font-size: 1.7rem; font-weight: 900; letter-spacing: 0.34em;
    color: var(--cyan); text-shadow: 0 0 18px rgba(61, 214, 245, 0.45);
  }
  .sub { margin-top: 6px; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mut); }
  .strip {
    margin: 14px 0 20px; font-size: 0.54rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mut);
  }
  .strip b { color: var(--lime); font-weight: 800; }
  .strip.off b { color: var(--amber); }

  .tile {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px;
    padding: 14px; border-radius: 14px; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font: inherit; transition: border-color 0.2s ease, transform 0.08s ease;
  }
  .tile:active { transform: translateY(1px); }
  .tile .ico {
    flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center;
    border-radius: 10px; font-size: 1.05rem;
    background: rgba(61, 214, 245, 0.10); color: var(--cyan); border: 1px solid rgba(61, 214, 245, 0.3);
  }
  .tile .body { flex: 1; min-width: 0; display: block; }
  .tile .name { display: block; font-size: 0.9rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }
  .tile .desc { display: block; font-size: 0.62rem; color: var(--mut); margin-top: 2px; line-height: 1.4; }
  .tile .go, .tile .chip {
    flex: 0 0 auto; font-size: 0.56rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid rgba(61, 214, 245, 0.35); border-radius: 8px; padding: 5px 9px;
  }
  .tile .chip { color: var(--mut); border-color: var(--line); }
  .tile.live { border-color: rgba(61, 214, 245, 0.32); box-shadow: 0 0 0 3px rgba(61, 214, 245, 0.05); }
  .tile.live .ico { color: var(--lime); border-color: rgba(74, 222, 128, 0.35); background: rgba(74, 222, 128, 0.08); }
  .tile.live .go { color: var(--lime); border-color: rgba(74, 222, 128, 0.4); }
  .tile.busy { border-color: rgba(255, 176, 32, 0.5); }
  .tile.busy .go { color: var(--amber); border-color: rgba(255, 176, 32, 0.5); }
  .tile.tbd { opacity: 0.62; cursor: default; }
  .tile.tbd:active { transform: none; }

  .note {
    margin: 4px 0 0; padding: 10px; border-radius: 10px; text-align: left;
    font-size: 0.68rem; line-height: 1.5; color: var(--amber);
    background: rgba(255, 176, 32, 0.08); border: 1px solid rgba(255, 176, 32, 0.3);
  }
  .note.bad { color: var(--red); background: rgba(255, 77, 109, 0.08); border-color: rgba(255, 77, 109, 0.3); }
  .note[hidden] { display: none; }
  .tiny { margin: 22px 0 0; font-size: 0.58rem; line-height: 1.7; color: var(--mut); opacity: 0.85; }
  .tiny b { color: var(--mut); font-weight: 700; }
  .bar { margin: 0 0 14px; height: 3px; border-radius: 3px; background: rgba(140, 170, 210, 0.14); overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--lime));
    box-shadow: 0 0 12px rgba(61, 214, 245, 0.5); transition: width 0.3s ease;
  }
  .bar i.bad { background: var(--red); box-shadow: 0 0 12px rgba(255, 77, 109, 0.5); }
  noscript p { color: var(--red); font-size: 0.8rem; }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <main>
    <div class="mark">PINDUTAN</div>
    <div class="sub">pick a game</div>
    <div class="strip" id="strip"><span id="deckBuild">deck m1</span> · arena <b id="arenaBuild">—</b></div>

    <div class="bar"><i id="bar"></i></div>
    <p class="note" id="note" hidden></p>

    <button class="tile live" id="tile-pindutan">
      <span class="ico">▚</span>
      <span class="body">
        <span class="name">Pindutan</span>
        <span class="desc">the neon block arena — stack, clear lines, fire garbage at your rivals</span>
      </span>
      <span class="go" id="arenaGo">▶ Play</span>
    </button>

    <button class="tile tbd" id="tile-two">
      <span class="ico">＋</span>
      <span class="body">
        <span class="name">Game two</span>
        <span class="desc">the slot is built and wired — the game is not written yet</span>
      </span>
      <span class="chip">TBD</span>
    </button>

    <button class="tile tbd" id="tile-three">
      <span class="ico">＋</span>
      <span class="body">
        <span class="name">Game three</span>
        <span class="desc">same here — one more chair, waiting for its game</span>
      </span>
      <span class="chip">TBD</span>
    </button>

    <p class="tiny">
      The Pindutan tile reads <b>labs/pindutan-build.json</b> on the <b>main</b> branch and
      opens whatever build that file names, so the arena here is always the newest one.
      This deck holds no game code.
    </p>
  </main>

  <noscript><p>Pindutan needs JavaScript. Turn it on, then reload this page.</p></noscript>

<script>
(function () {
  "use strict";

  var FEED = "https://raw.githubusercontent.com/gret521x-coder/Gretsanti/main/labs/pindutan-build.json";
  var ARENA = "https://raw.githubusercontent.com/gret521x-coder/Gretsanti/main/labs/pindutan-v21.html";
  var MIN_BYTES = 20000;
  var DECK = "m1";

  var strip = document.getElementById("strip");
  var deckBuild = document.getElementById("deckBuild");
  var arenaBuild = document.getElementById("arenaBuild");
  var note = document.getElementById("note");
  var bar = document.getElementById("bar");
  var tile = document.getElementById("tile-pindutan");
  var go = document.getElementById("arenaGo");

  function bust(url) {
    return url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
  }

  /* XHR second, for a browser that will not let a file:// page fetch */
  function viaXhr(url) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open("GET", bust(url), true);
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) resolve(x.responseText);
        else reject(new Error("HTTP " + x.status));
      };
      x.onerror = function () { reject(new Error("network refused the request")); };
      try { x.send(); } catch (e) { reject(e); }
    });
  }

  function fetchText(url) {
    if (typeof fetch === "function") {
      return fetch(bust(url), { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      }).catch(function () { return viaXhr(url); });
    }
    return viaXhr(url);
  }

  function say(text, bad) {
    note.hidden = !text;
    note.textContent = text || "";
    note.className = "note" + (bad ? " bad" : "");
  }

  function percent(p) { bar.style.width = p + "%"; }

  function busy(on) {
    tile.classList.toggle("busy", !!on);
    go.textContent = on ? "…" : "▶ Play";
  }

  /* the newest arena, then hand the whole page over to it */
  function openArena() {
    busy(true);
    bar.classList.remove("bad");
    percent(18);
    say("Looking for the newest arena…", false);
    var wanted = "";
    fetchText(FEED).then(function (raw) {
      var feed = {};
      try { feed = JSON.parse(raw) || {}; } catch (e) { feed = {}; }
      wanted = String(feed.build || "").trim();
      var url = (feed && feed.html) || ARENA;
      if (wanted) {
        arenaBuild.textContent = wanted;
        strip.classList.remove("off");
      }
      percent(56);
      say("Arena " + (wanted || "newest") + " — opening…", false);
      return fetchText(url).then(function (html) { return { html: html, build: wanted }; });
    }).then(function (got) {
      var html = got.html || "";
      if (html.length < MIN_BYTES ||
          html.indexOf("</html>") < 0 ||
          html.indexOf("SELF-UPDATE") < 0) {
        throw new Error("the file that came back is not a whole game");
      }
      percent(100);
      document.title = "Pindutan " + (got.build || "");
      document.open();
      document.write(html);
      document.close();
    }).catch(function (e) {
      busy(false);
      bar.classList.add("bad");
      percent(100);
      strip.classList.add("off");
      say("Could not open the arena (" + String((e && e.message) || e) +
        "). Check your signal and tap Pindutan again — nothing is lost.", true);
    });
  }

  tile.addEventListener("click", function () {
    if (tile.classList.contains("busy")) return;
    openArena();
  });

  /* the two empty chairs */
  Array.prototype.forEach.call(document.querySelectorAll(".tile.tbd"), function (el) {
    el.addEventListener("click", function () {
      var name = el.querySelector(".name").textContent;
      say(name + " is not built yet — the slot is wired and waiting for it.", false);
    });
  });

  /* say which arena is waiting, before anyone taps */
  deckBuild.textContent = "deck " + DECK;
  fetchText(FEED).then(function (raw) {
    var feed = {};
    try { feed = JSON.parse(raw) || {}; } catch (e) { feed = {}; }
    var build = String(feed.build || "").trim();
    if (build) {
      arenaBuild.textContent = build;
      strip.classList.remove("off");
    }
  }).catch(function () {
    strip.classList.add("off");
    arenaBuild.textContent = "offline";
  });
})();
</script>
</body>
</html>
