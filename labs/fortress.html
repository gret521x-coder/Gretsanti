<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1008">
<title>KDL // FORTRESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1008;--panel:#11160d;--card:#171d12;--line:#2a3322;--line-2:#3a4730;
  --text:#fff;--dim:#9aa88c;--faint:#5c6a52;
  --gold:#ffd166;--cyan:#38bdf8;--ok:#00e676;--stop:#ff3d00;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{position:fixed;inset:0;color:var(--text);font-family:var(--sans)}
#game{position:relative;height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}

/* ---------------- top bar ---------------- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 9px;
  background:linear-gradient(#182014,#0d120a);border-bottom:1px solid var(--line);z-index:4}
.pill{display:flex;align-items:center;gap:5px;background:#0a0e07;border:1px solid var(--line);
  padding:4px 8px;border-radius:2px;min-width:0}
.pill img{height:20px;width:auto;display:block;image-rendering:pixelated}
.pill b{font-family:var(--mono);font-size:12.5px;font-weight:700;line-height:1;letter-spacing:.3px}
.pill.gold b{color:var(--gold)}
.pill.wave b{color:var(--cyan)}
.pill.hp b{color:var(--ok)}
#hpbar{width:46px;height:6px;background:#1b2415;border:1px solid var(--line);overflow:hidden}
#hpfill{height:100%;width:100%;background:var(--ok);transition:width .2s,background .2s}
.spacer{flex:1}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;background:#0a0e07;
  border:1px solid var(--line);border-radius:2px;color:var(--dim);font-size:13px;line-height:1}
.icon-btn:active{background:#1b2415}
.icon-btn.on{border-color:var(--cyan);color:var(--cyan)}

/* ---------------- field ---------------- */
#wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#3f5c2c}
#field{display:block;width:100%;height:100%;touch-action:manipulation;image-rendering:pixelated}
#tip{position:absolute;left:50%;top:8px;transform:translateX(-50%);pointer-events:none;
  font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:#eaf3dd;background:rgba(8,12,6,.62);padding:5px 10px;white-space:nowrap;border-radius:2px}
#nextwave{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  background:#2f6b1e;border:1px solid #78c94a;color:#fff;padding:9px 18px;border-radius:2px;display:none}
#nextwave.on{display:block}
#nextwave:active{background:#3d8a26}

/* ---------------- bottom bar ---------------- */
#bar{flex:0 0 auto;display:flex;gap:6px;padding:7px 7px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(#0d120a,#161d10);border-top:1px solid var(--line);z-index:4}
.slot{flex:1;min-width:0;position:relative;border:1px solid var(--line);background:#0a0e07;
  border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:4px 2px 3px;overflow:hidden}
.slot .art{height:36px;width:100%;display:flex;align-items:center;justify-content:center}
.slot .art img{max-height:36px;max-width:100%;image-rendering:pixelated}
.slot .nm{font-family:var(--mono);font-size:7.2px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .cst{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--gold);line-height:1.1}
.slot.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.slot.poor{opacity:.42}
.slot.cool{opacity:.55}
.slot .cool-mask{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);
  height:0;pointer-events:none;transition:height .2s linear}
.slot .cool-num{position:absolute;inset:0;display:none;place-items:center;font-family:var(--mono);
  font-size:13px;font-weight:700;color:#fff}
.slot.cool .cool-num{display:grid}
.hero-slot .art{border-radius:50%;background:#0e140a;height:38px;width:38px;border:1px solid var(--line-2)}
.hero-slot .art img{max-height:34px}
#bar .divider{width:1px;background:var(--line);margin:2px 1px}

/* ---------------- overlays ---------------- */
#overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,9,4,.86);z-index:8}
#overlay.on{display:grid}
.box{width:min(90%,340px);background:var(--panel);border:1px solid var(--line);padding:22px;text-align:center}
.box h2{font-family:var(--mono);font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--stop);margin-bottom:10px;font-weight:700}
.box.win h2{color:var(--ok)}
.box p{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:16px}
.btn{border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--mono);
  font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;padding:11px 16px}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(12,17,9,.96);border:1px solid #78c94a;color:#fff;font-family:var(--mono);
  font-size:9px;letter-spacing:1.3px;text-transform:uppercase;padding:8px 13px;opacity:0;
  transition:.22s;pointer-events:none;z-index:20;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <div class="pill gold"><img id="gold-icon" alt=""><b id="s-gold">250</b></div>
    <div class="pill hp"><b id="s-hp">10</b><div id="hpbar"><div id="hpfill"></div></div></div>
    <div class="pill wave"><b id="s-wave">1/3</b></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="b-pause" aria-label="pause">❚❚</button>
    <button class="icon-btn" id="b-speed" aria-label="speed">▸▸</button>
  </div>

  <div id="wrap">
    <canvas id="field"></canvas>
    <div id="tip">pick a tower, then tap a stone pad</div>
    <button id="nextwave">Next wave</button>
    <div id="overlay">
      <div class="box" id="over-box">
        <h2 id="over-title">The camp fell</h2>
        <p id="over-text"></p>
        <button class="btn primary" id="again">Try again</button>
      </div>
    </div>
  </div>

  <div id="bar">
    <div class="slot hero-slot" data-hero="warrior"><div class="art"><img id="art-warrior" alt=""></div><div class="nm">Warrior</div><div class="cool-mask"></div><div class="cool-num"></div></div>
    <div class="slot hero-slot" data-hero="archer"><div class="art"><img id="art-archer" alt=""></div><div class="nm">Archer</div><div class="cool-mask"></div><div class="cool-num"></div></div>
    <div class="slot hero-slot" data-hero="spear"><div class="art"><img id="art-spear" alt=""></div><div class="nm">Spearman</div><div class="cool-mask"></div><div class="cool-num"></div></div>
    <div class="divider"></div>
    <div class="slot" data-tower="archery"><div class="art"><img id="art-archery" alt=""></div><div class="nm">Archers</div><div class="cst">90</div></div>
    <div class="slot" data-tower="banner"><div class="art"><img id="art-banner" alt=""></div><div class="nm">Banner</div><div class="cst">130</div></div>
    <div class="slot" data-tower="stone"><div class="art"><img id="art-stone" alt=""></div><div class="nm">Stone</div><div class="cst">160</div></div>
  </div>
</div>
<div id="toast"></div>

var PATH = [], PATH_LEN = 0;
(function buildPath() {
  for (var i = 0; i < PTS.length - 1; i++) {
    var a = PTS[i], b = PTS[i + 1];
    var len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    PATH.push({ x: a[0], y: a[1], ang: Math.atan2(b[1] - a[1], b[0] - a[0]), len: len, cum: PATH_LEN });
    PATH_LEN += len;
  }
  PATH.push({ x: PTS[PTS.length - 1][0], y: PTS[PTS.length - 1][1], ang: 0, len: 0, cum: PATH_LEN });
})();

function pointAt(s) {
  if (s <= 0) return { x: PATH[0].x, y: PATH[0].y, ang: PATH[0].ang };
  if (s >= PATH_LEN) { var e = PATH[PATH.length - 1]; return { x: e.x, y: e.y, ang: e.ang }; }
  for (var i = 0; i < PATH.length - 1; i++) {
    var seg = PATH[i];
    if (s <= seg.cum + seg.len) {
      var t = (s - seg.cum) / seg.len;
      return { x: seg.x + Math.cos(seg.ang) * seg.len * t, y: seg.y + Math.sin(seg.ang) * seg.len * t, ang: seg.ang };
    }
  }
  return { x: PATH[0].x, y: PATH[0].y, ang: 0 };
}

function distToPath(x, y) {
  var best = 1e9;
  for (var i = 0; i < PTS.length - 1; i++) {
    var a = PTS[i], b = PTS[i + 1];
    var vx = b[0] - a[0], vy = b[1] - a[1], L2 = vx * vx + vy * vy;
    var t = L2 ? Math.max(0, Math.min(1, ((x - a[0]) * vx + (y - a[1]) * vy) / L2)) : 0;
    var d = Math.hypot(x - (a[0] + vx * t), y - (a[1] + vy * t));
    if (d < best) best = d;
  }
  return best;
}

function sNearest(x, y) {
  var best = 0, bestD = 1e9;
  for (var s = 0; s <= PATH_LEN; s += 10) {
    var p = pointAt(s), d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = s; }
  }
  return { s: best, d: bestD };
}

/* --------------------------------------------------------------- helpers */
function toast(t) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(el._h);
  el._h = setTimeout(function () { el.classList.remove('on'); }, 1400);
}
function towerAt(i) { return G.pads[i]; }

/* --------------------------------------------------------------- canvas */
function size() {
  if (!cv) return;
  var r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(240, Math.round(r.width));
  H = Math.max(220, Math.round(r.height));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  if (ctx) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  SC = Math.min(W / MAP_W, H / MAP_H);
  OX = (W - MAP_W * SC) / 2;
  OY = (H - MAP_H * SC) / 2;
}
function toWorld(px, py) { return { x: (px - OX) / SC, y: (py - OY) / SC }; }

/* --------------------------------------------------------------- images */
function loadImages(done) {
  var keys = Object.keys(SPR);
  total = keys.length;
  if (!total) { done(); return; }
  keys.forEach(function (k) {
    var img = new Image();
    img.onload = img.onerror = function () {
      loaded++;
      if (loaded >= total) done();
    };
    img.src = SPR[k];
    IMG[k] = img;
  });
}

/* --------------------------------------------------------------- waves */
function wavePlan(index) {
  var out = [], t = 0, spec = WAVES[index] || [];
  spec.forEach(function (group) {
    var kind = group[0], count = group[1], gap = group[2];
    for (var i = 0; i < count; i++) out.push({ at: t + i * gap, kind: kind });
    t += count * gap * 0.55;
  });
  out.sort(function (a, b) { return a.at - b.at; });
  return out;
}

function startWave() {
  if (G.over) return;
  if (G.wave >= G.waveTotal) { endGame(true); return; }
  G.wave++;
  G.queue = wavePlan(G.wave - 1);
  G.waveClock = 0;
  G.running = true;
  G.betweenWaves = 0;
  toast('Wave ' + G.wave + ' of ' + G.waveTotal);
  paintHud();
}

function spawnEnemy(kind) {
  var e = ENEMIES[kind] || ENEMIES.skeleton;
  G.enemies.push({
    kind: kind, s: 0, hp: e.hp, maxHp: e.hp, dmg: e.dmg,
    speed: e.speed, baseSpeed: e.speed, bounty: e.bounty,
    scale: e.scale, sprite: e.sprite, h: e.h,
    cd: 0, hitAt: -9999, slowUntil: 0, anim: Math.random() * 10
  });
}

/* --------------------------------------------------------------- actions */
function buildTower(padIndex, kind) {
  var t = TOWERS[kind];
  if (!t || G.over) return false;
  if (G.pads[padIndex]) { toast('That pad is taken'); return false; }
  if (G.gold < t.cost) { toast('Need ' + t.cost + ' gold'); return false; }
  G.gold -= t.cost;
  var pad = PADS[padIndex];
  var tower = {
    kind: kind, padIndex: padIndex, x: pad.x, y: pad.y, level: 1,
    baseDmg: t.dmg, baseRange: t.range, baseCost: t.cost,
    range: t.range, dmg: t.dmg, rate: t.rate, cd: 0, sprite: t.sprite, h: t.h,
    slow: t.slow || 0, shots: 0
  };
  G.pads[padIndex] = tower;
  G.towers.push(tower);
  paintHud();
  return true;
}

function upgradeCost(tower) {
  return Math.round(tower.baseCost * 0.8 * Math.pow(1.7, tower.level - 1));
}

function upgradeTower(padIndex) {
  var tw = G.pads[padIndex];
  if (!tw || G.over) return false;
  if (tw.level >= 3) { toast('This tower is as high as it goes'); return false; }
  var cost = upgradeCost(tw);
  if (G.gold < cost) { toast('Need ' + cost + ' gold to raise it'); return false; }
  G.gold -= cost;
  tw.level++;
  tw.dmg = Math.round(tw.baseDmg * Math.pow(1.5, tw.level - 1));
  tw.range = Math.round(tw.baseRange * Math.pow(1.08, tw.level - 1));
  toast(TOWERS[tw.kind].name + ' raised to ' + tw.level);
  paintHud();
  return true;
}

function summonHero(key) {
  var def = HEROES[key];
  if (!def || G.over) return false;
  var st = G.heroState[key];
  if (st.alive) { toast(def.name + ' is already out'); return false; }
  if (st.cd > 0) { toast(def.name + ' back in ' + Math.ceil(st.cd / 1000) + 's'); return false; }
  st.alive = true;
  st.cd = 0;
  G.heroes.push({
    key: key, s: PATH_LEN - 120, hp: def.hp, maxHp: def.hp, dmg: def.dmg,
    rate: def.rate, range: def.range, speed: def.speed, sprite: def.sprite,
    h: def.h, ranged: !!def.ranged, cd: 0, hitAt: -9999, anim: 0
  });
  toast(def.name + ' rides out');
  paintHud();
  return true;
}

/* --------------------------------------------------------------- combat */
function nearestEnemy(fromS, range) {
  var best = null, bestD = 1e9;
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.hp <= 0) continue;
    var d = Math.abs(e.s - fromS);
    if (d <= range && d < bestD) { bestD = d; best = e; }
  }
  return best;
}
function closestEnemy(fromS) {
  var best = null, bestD = 1e9;
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.hp <= 0) continue;
    var d = Math.abs(e.s - fromS);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}
function awardDeath(e) {
  if (e.awarded) return;
  e.awarded = true;
  G.gold += e.bounty;
  G.kills++;
}
function worldOfS(s) { return pointAt(s); }

function enemyAtPoint(x, y, range) {
  var best = null, bestD = 1e9;
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.hp <= 0) continue;
    var p = pointAt(e.s);
    var d = Math.hypot(p.x - x, p.y - y);
    if (d <= range && d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function shoot(fromX, fromY, target, dmg) {
  var p = pointAt(target.s);
  G.shots.push({ x: fromX, y: fromY, target: target, dmg: dmg, speed: 620, life: 1400 });
}

function step(now, dt) {
  if (!G || G.over || paused) return;
  var d = dt * speed;
  G.gold += GOLD_RATE * d / 1000;

  /* towers */
  for (var t = 0; t < G.towers.length; t++) {
    var tw = G.towers[t];
    tw.cd -= d;
    if (tw.cd > 0) continue;
    var targetE = enemyAtPoint(tw.x, tw.y - 40, tw.range);
    if (!targetE) continue;
    tw.cd = tw.rate;
    shoot(tw.x, tw.y - 70, targetE, tw.dmg);
    if (tw.slow) targetE.slowUntil = now + 1600;
  }

  /* shots travel and land */
  for (var s = G.shots.length - 1; s >= 0; s--) {
    var sh = G.shots[s];
    sh.life -= d;
    var tp = sh.target && sh.target.hp > 0 ? pointAt(sh.target.s) : null;
    if (!tp) { sh.life = Math.min(sh.life, 60); tp = { x: sh.x, y: sh.y }; }
    var dx = tp.x - sh.x, dy = (tp.y - 20) - sh.y, dist = Math.hypot(dx, dy);
    var stepLen = sh.speed * d / 1000;
    if (dist <= stepLen || sh.life <= 0) {
      if (sh.target && sh.target.hp > 0) sh.target.hp -= sh.dmg;
      G.shots.splice(s, 1);
      continue;
    }
    sh.x += dx / dist * stepLen;
    sh.y += dy / dist * stepLen;
  }

  /* enemies walk the road */
  for (var i = G.enemies.length - 1; i >= 0; i--) {
    var en = G.enemies[i];
    if (en.hp <= 0) { awardDeath(en); G.enemies.splice(i, 1); continue; }
    en.anim += d;
    en.speed = now < en.slowUntil ? en.baseSpeed * 0.55 : en.baseSpeed;
    /* stop and fight any hero close by */
    var heroNear = null, heroD = 1e9;
    for (var h2 = 0; h2 < G.heroes.length; h2++) {
      var hh = G.heroes[h2];
      if (hh.hp <= 0) continue;
      var dd = Math.abs(hh.s - en.s);
      if (dd < heroD) { heroD = dd; heroNear = hh; }
    }
    if (heroNear && heroD <= 90) {
      en.cd -= d;
      if (en.cd <= 0) {
        en.cd = 900;
        heroNear.hp -= en.dmg;
        en.hitAt = now;
      }
      continue;
    }
    en.s += en.speed * d / 1000;
    if (en.s >= PATH_LEN - 14) {
      G.hp--;
      G.enemies.splice(i, 1);
      if (G.hp <= 0) { G.hp = 0; endGame(false); return; }
      paintHud();
    }
  }

  /* heroes fight, or walk toward the nearest monster */
  for (var j = G.heroes.length - 1; j >= 0; j--) {
    var u = G.heroes[j];
    if (u.hp <= 0) {
      if (G.heroState[u.key]) { G.heroState[u.key].alive = false; G.heroState[u.key].cd = HEROES[u.key].respawn; }
      G.heroes.splice(j, 1);
      continue;
    }
    u.anim += d;
    var tgt = nearestEnemy(u.s, u.range);
    if (tgt) {
      u.cd -= d;
      if (u.cd <= 0) {
        u.cd = u.rate;
        u.hitAt = now;
        if (u.ranged) { var pp = pointAt(u.s); shoot(pp.x, pp.y - 50, tgt, u.dmg); }
        else { tgt.hp -= u.dmg; }
      }
    } else {
      var hunt = closestEnemy(u.s);
      if (hunt) {
        u.s += (hunt.s > u.s ? 1 : -1) * u.speed * d / 1000;
      } else {
        u.s += u.speed * d / 1000 * 0.4;
      }
      u.s = Math.max(60, Math.min(PATH_LEN - 60, u.s));
    }
  }

  /* hero respawn clocks */
  for (var k in G.heroState) {
    var st = G.heroState[k];
    if (!st.alive && st.cd > 0) {
      st.cd -= d;
      if (st.cd < 0) st.cd = 0;
    }
  }

  /* dead cleanup */
  for (var m = G.enemies.length - 1; m >= 0; m--) {
    if (G.enemies[m].hp <= 0) { awardDeath(G.enemies[m]); G.enemies.splice(m, 1); }
  }

  /* wave flow */
  if (G.queue.length) {
    G.waveClock += d;
    while (G.queue.length && G.queue[0].at <= G.waveClock) {
      var q = G.queue.shift();
      spawnEnemy(q.kind);
    }
  } else if (G.running && !G.enemies.length) {
    G.running = false;
    if (G.wave >= G.waveTotal) { endGame(true); return; }
    G.betweenWaves = 6000;
    toast('Wave ' + G.wave + ' cleared');
  }

  if (!G.running && G.betweenWaves > 0) {
    G.betweenWaves -= d;
    if (G.betweenWaves <= 0) startWave();
  }
  paintHud();
}

/* --------------------------------------------------------------- drawing */
function px(v) { return v * SC; }

function drawSprite(key, x, y, hWorld, opts) {
  var img = IMG[key];
  if (!img || !img.width) return;
  var hh = hWorld * SC * (opts && opts.scale ? opts.scale : 1);
  var ww = hh * (img.width / img.height);
  ctx.drawImage(img, x - ww / 2, y - hh, ww, hh);
}

function draw(now) {
  if (!ctx) return;
  ctx.fillStyle = '#466332';
  ctx.fillRect(0, 0, W, H);
  drawGround();                 /* painted across the whole canvas, so the map never floats */
  ctx.save();
  ctx.translate(OX, OY);
  ctx.scale(SC, SC);

  drawRoad();
  drawPads();
  drawCamp();
  drawCastle();
  drawDecoList();
  drawEntities(now);
  drawShots();

  /* selection ring around the chosen pad */
  if (selectPad >= 0) {
    var pad = PADS[selectPad];
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 9]);
    ctx.beginPath();
    ctx.arc(pad.x, pad.y, 62, 0, 6.2832);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function drawGround() {
  /* mown bands and tufts across the whole canvas, from a fixed seed */
  for (var i = 0; i < H; i += 46) {
    ctx.fillStyle = (Math.floor(i / 46) % 2 === 0) ? 'rgba(255,255,255,.028)' : 'rgba(0,0,0,.034)';
    ctx.fillRect(0, i, W, 46);
  }
  var seed = 991;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 10000) / 10000; }
  for (var t = 0; t < 320; t++) {
    var x = rnd() * W, y = rnd() * H;
    var wxp = (x - OX) / SC, wyp = (y - OY) / SC;
    if (wxp > 0 && wxp < MAP_W && wyp > 0 && wyp < MAP_H && distToPath(wxp, wyp) < ROAD_W * 0.9) continue;
    ctx.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)';
    var w = 2 + rnd() * 3;
    ctx.fillRect(x, y, w, w * 0.55);
  }
  /* a soft vignette so the edges settle down */
  var vg = ctx.createRadialGradient ? ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75) : null;
  if (vg) {
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawRoad() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  road('#26301a', ROAD_W + 28);
  road('#6d5729', ROAD_W + 18);
  road('#cbb069', ROAD_W);
  ctx.setLineDash([12, 14]);
  road('rgba(255,246,206,.30)', ROAD_W - 12);
  ctx.setLineDash([]);
}

function road(color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(PTS[0][0], PTS[0][1]);
  for (var i = 1; i < PTS.length; i++) ctx.lineTo(PTS[i][0], PTS[i][1]);
  ctx.stroke();
}

function drawPads() {
  for (var i = 0; i < PADS.length; i++) {
    var p = PADS[i], taken = !!G.pads[i];
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 6, 56, 30, 0, 0, 6.2832);
    ctx.fill();
    if (!taken) {
      ctx.fillStyle = 'rgba(122,134,104,.55)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 54, 28, 0, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = 'rgba(240,246,225,.42)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
      /* a little plus sign so a pad reads as buildable */
      ctx.strokeStyle = 'rgba(255,255,255,.6)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(p.x - 12, p.y); ctx.lineTo(p.x + 12, p.y);
      ctx.moveTo(p.x, p.y - 8); ctx.lineTo(p.x, p.y + 8);
      ctx.stroke();
    }
  }
  /* towers last so they sit on the pads, with pips for their level */
  for (var t = 0; t < G.towers.length; t++) {
    var tw = G.towers[t];
    drawSprite(tw.sprite, tw.x, tw.y + 16, tw.h);
    for (var lv = 1; lv < tw.level; lv++) {
      ctx.fillStyle = 'rgba(255,209,102,.95)';
      ctx.fillRect(tw.x - 22 + (lv - 1) * 14, tw.y + 18, 9, 9);
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(tw.x - 22 + (lv - 1) * 14, tw.y + 18, 9, 9);
    }
  }
}

function drawCamp() {
  var x = CAMP.x, y = CAMP.y;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(x, y + 10, 70, 30, 0, 0, 6.2832);
  ctx.fill();
  /* a dark tent mouth spilling monsters onto the road */
  ctx.fillStyle = '#20261a';
  ctx.beginPath();
  ctx.moveTo(x - 54, y + 6);
  ctx.lineTo(x - 8, y - 62);
  ctx.lineTo(x + 40, y + 6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#3a2718';
  ctx.beginPath();
  ctx.moveTo(x - 20, y + 6);
  ctx.lineTo(x - 4, y - 34);
  ctx.lineTo(x + 14, y + 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,61,0,.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x - 3, y - 6, 16, 0, 6.2832);
  ctx.stroke();
}

function drawCastle() {
  drawSprite('castle', CASTLE.x, CASTLE.y + 8, 320);
}

function drawDecoList() {
  var list = DECO.slice().sort(function (a, b) { return a.y - b.y; });
  for (var i = 0; i < list.length; i++) {
    var dcr = list[i];
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(dcr.x, dcr.y, dcr.h * 0.22, dcr.h * 0.09, 0, 0, 6.2832);
    ctx.fill();
    drawSprite(dcr.k, dcr.x, dcr.y, dcr.h);
  }
}

function drawEntities(now) {
  var items = [];
  for (var i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    var p = pointAt(e.s);
    items.push({ y: p.y, kind: 'enemy', obj: e, x: p.x - 26, py: p.y });
  }
  for (var j = 0; j < G.heroes.length; j++) {
    var u = G.heroes[j];
    var q = pointAt(u.s);
    items.push({ y: q.y, kind: 'hero', obj: u, x: q.x + 26, py: q.y });
  }
  items.sort(function (a, b) { return a.y - b.y; });

  for (var k = 0; k < items.length; k++) {
    var it = items[k], o = it.obj;
    var bob = Math.sin((o.anim || 0) / 170) * 2;
    var hit = Math.max(0, 1 - (now - (o.hitAt || -9999)) / 160);
    var hh = o.h * (o.scale || 1) * (1 + hit * 0.04);

    ctx.fillStyle = 'rgba(0,0,0,.26)';
    ctx.beginPath();
    ctx.ellipse(it.x, it.py + 2, hh * 0.30, hh * 0.12, 0, 0, 6.2832);
    ctx.fill();

    if (o.kind === 'brute') ctx.filter = 'saturate(.65) hue-rotate(-24deg) brightness(.85)';
    drawSprite(o.sprite, it.x, it.py + 2 + bob, o.h, { scale: o.scale || 1 });
    ctx.filter = 'none';

    /* health bar over heroes and brutes only — the rest would be noise */
    var showBar = it.kind === 'hero' || o.kind === 'brute';
    if (showBar) {
      var bw = it.kind === 'hero' ? 46 : 56;
      var frac = Math.max(0, o.hp / o.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,.62)';
      ctx.fillRect(it.x - bw / 2, it.py - hh - 12, bw, 6);
      ctx.fillStyle = frac > 0.5 ? '#5ddf4a' : frac > 0.25 ? '#ffc107' : '#ff3d00';
      ctx.fillRect(it.x - bw / 2, it.py - hh - 12, bw * frac, 6);
    }
  }
}

function drawShots() {
  for (var i = 0; i < G.shots.length; i++) {
    var s = G.shots[i];
    ctx.strokeStyle = '#f7f0cf';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - 12, s.y + 6);
    ctx.stroke();
  }
}

/* --------------------------------------------------------------- hud */
function paintHud() {
  if (!G) return;
  var g = document.getElementById('s-gold');
  if (!g) return;
  g.textContent = Math.floor(G.gold);
  document.getElementById('s-hp').textContent = G.hp;
  document.getElementById('hpfill').style.width = (Math.max(0, G.hp) / G.maxHp * 100) + '%';
  document.getElementById('hpfill').style.background = G.hp / G.maxHp > 0.5 ? '#00e676' : G.hp / G.maxHp > 0.25 ? '#ffab00' : '#ff3d00';
  document.getElementById('s-wave').textContent = Math.max(1, G.wave) + '/' + G.waveTotal;

  var towers = document.querySelectorAll('[data-tower]');
  for (var i = 0; i < towers.length; i++) {
    var k = towers[i].getAttribute('data-tower');
    towers[i].classList.toggle('poor', G.gold < TOWERS[k].cost);
    towers[i].classList.toggle('sel', selectTower === k);
  }
  var heroes = document.querySelectorAll('[data-hero]');
  for (var j = 0; j < heroes.length; j++) {
    var hk = heroes[j].getAttribute('data-hero');
    var st = G.heroState[hk];
    heroes[j].classList.toggle('cool', !st.alive && st.cd > 0);
    var num = heroes[j].querySelector('.cool-num');
    if (num) num.textContent = st.alive ? '' : Math.ceil(st.cd / 1000);
    var mask = heroes[j].querySelector('.cool-mask');
    if (mask) mask.style.height = (!st.alive && st.cd > 0) ? (st.cd / HEROES[hk].respawn * 100) + '%' : '0%';
  }
  var nw = document.getElementById('nextwave');
  if (nw) {
    var waiting = !G.running && !G.over && G.wave < G.waveTotal;
    nw.classList.toggle('on', waiting);
    if (waiting) nw.textContent = 'Next wave · ' + Math.max(0, Math.ceil(G.betweenWaves / 1000)) + 's';
  }
}

/* --------------------------------------------------------------- loop */
function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(70, ts - lastTs);
  lastTs = ts;
  step(ts, dt);
  draw(ts);
  if (!G.over) raf = requestAnimationFrame(loop);
}

function endGame(won) {
  G.over = true;
  G.won = !!won;
  var box = document.getElementById('over-box');
  document.getElementById('over-title').textContent = won ? 'The road holds' : 'The camp fell';
  document.getElementById('over-text').textContent = won
    ? 'All ' + G.waveTotal + ' waves broken, ' + G.kills + ' monsters down, ' + G.hp + ' of ' + G.maxHp + ' keep left.'
    : 'They got through on wave ' + Math.max(1, G.wave) + '. ' + G.kills + ' monsters down before the end.';
  box.classList.toggle('win', !!won);
  document.getElementById('overlay').classList.add('on');
  paintHud();
}

function restart() {
  G = fresh();
  selectTower = null;
  selectPad = -1;
  document.getElementById('overlay').classList.remove('on');
  size();
  paintHud();
  G.betweenWaves = 5000;
  if (raf) cancelAnimationFrame(raf);
  lastTs = 0;
  raf = requestAnimationFrame(loop);
}

/* --------------------------------------------------------------- input */
function tap(px_, py_) {
  var wp = toWorld(px_, py_);

  /* a pad first — they are the big targets */
  for (var i = 0; i < PADS.length; i++) {
    var p = PADS[i];
    if (Math.hypot(p.x - wp.x, (p.y - wp.y) * 1.6) < 96) {
      if (G.pads[i]) { upgradeTower(i); return; }
      selectPad = i;
      if (selectTower) {
        if (buildTower(i, selectTower)) { selectPad = -1; }
      } else {
        toast('Now pick a tower below');
      }
      paintHud();
      return;
    }
  }
  /* tapping the road sends the selected hero out at that spot */
  var near = sNearest(wp.x, wp.y);
  if (near.d < ROAD_W * 0.9 && selectTower === null) {
    toast('Tap a hero portrait to send them out');
  }
}

if (cv) {
  cv.addEventListener('pointerdown', function (ev) {
    if (!G || G.over) return;
    var r = cv.getBoundingClientRect();
    tap(ev.clientX - r.left, ev.clientY - r.top);
  });
}

document.querySelectorAll('[data-tower]').forEach(function (el) {
  el.addEventListener('click', function () {
    var k = el.getAttribute('data-tower');
    selectTower = (selectTower === k) ? null : k;
    selectPad = -1;
    var tip = document.getElementById('tip');
    if (tip) tip.textContent = selectTower ? 'tap a stone pad to raise ' + TOWERS[k].name : 'pick a tower, then tap a stone pad';
    paintHud();
  });
});

document.querySelectorAll('[data-hero]').forEach(function (el) {
  el.addEventListener('click', function () {
    summonHero(el.getAttribute('data-hero'));
  });
});

document.getElementById('b-pause').addEventListener('click', function () {
  paused = !paused;
  this.classList.toggle('on', paused);
  this.textContent = paused ? '▶' : '❚❚';
  lastTs = 0;
});
document.getElementById('b-speed').addEventListener('click', function () {
  speed = speed === 1 ? 2 : 1;
  this.classList.toggle('on', speed === 2);
});
document.getElementById('nextwave').addEventListener('click', function () {
  if (!G.running && !G.over && G.wave < G.waveTotal) {
    G.betweenWaves = 0;
    startWave();
  }
});
document.getElementById('again').addEventListener('click', restart);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
  else if (!raf && G && !G.over) { lastTs = 0; raf = requestAnimationFrame(loop); }
});
window.addEventListener('resize', function () { size(); });

/* --------------------------------------------------------------- boot */
cv = document.getElementById('field');
ctx = cv && cv.getContext ? cv.getContext('2d') : null;
G = fresh();

function wireIcons() {
  var map = {
    'gold-icon': 'gold',
    'art-warrior': 'icon_warrior', 'art-archer': 'icon_archer', 'art-spear': 'icon_spear',
    'art-archery': 'archery', 'art-banner': 'barracks', 'art-stone': 'stone',
    's-gold-icon': 'gold'
  };
  for (var id in map) {
    var el = document.getElementById(id);
    if (el && SPR[map[id]]) el.src = SPR[map[id]];
  }
}

function boot() {
  size();
  wireIcons();
  paintHud();
  G.betweenWaves = 5000;
  if (cv && ctx) {
    raf = requestAnimationFrame(loop);
  } else {
    var tip = document.getElementById('tip');
    if (tip) tip.textContent = 'this browser has no canvas';
  }
}
wireIcons();
boot();
loadImages(function () { wireIcons(); });

window.KDL_FORTRESS = {
  state: function () { return G; },
  step: step,
  build: buildTower,
  upgrade: upgradeTower,
  upgradeCost: upgradeCost,
  summon: summonHero,
  startWave: startWave,
  restart: restart,
  tap: tap,
  pointAt: pointAt,
  pads: PADS,
  pathLength: function () { return PATH_LEN; },
  towers: TOWERS,
  heroes: HEROES,
  enemies: ENEMIES,
  waves: WAVES,
  sprites: function () { return SPR; },
  setPaused: function (v) { paused = !!v; }
};
</script>
