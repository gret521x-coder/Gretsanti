<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Pindutan — the first runner</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: #0b1120;
      --line: rgba(140, 170, 210, 0.16);
      --ink: #e8f1ff;
      --mut: #7f93ad;
      --cyan: #3dd6f5;
      --lime: #4ade80;
      --red: #ff4d6d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      padding: 24px;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(61, 214, 245, 0.10), transparent 60%),
        radial-gradient(90% 60% at 50% 100%, rgba(74, 222, 128, 0.07), transparent 60%),
        var(--bg);
      color: var(--ink);
      font: 500 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(420px, 100%); text-align: center; }
    .mark {
      font-size: 1.6rem; font-weight: 900; letter-spacing: 0.34em;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(61, 214, 245, 0.45);
    }
    .sub {
      margin-top: 6px;
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--mut);
    }
    .bar {
      margin: 26px 0 14px; height: 3px; border-radius: 3px;
      background: rgba(140, 170, 210, 0.14); overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 8%; border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
      box-shadow: 0 0 12px rgba(61, 214, 245, 0.5);
      transition: width 0.35s ease;
    }
    .bar i.bad { background: var(--red); box-shadow: 0 0 12px rgba(255, 77, 109, 0.5); }
    .line { margin: 0; font-size: 0.82rem; color: var(--ink); }
    .hint {
      margin: 10px 0 0; font-size: 0.72rem; color: var(--red);
      background: rgba(255, 77, 109, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.28);
      border-radius: 10px; padding: 10px;
    }
    .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .btn {
      appearance: none; cursor: pointer;
      padding: 9px 14px; border-radius: 10px;
      border: 1px solid rgba(61, 214, 245, 0.4);
      background: rgba(61, 214, 245, 0.12);
      color: var(--cyan);
      font: inherit; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em;
      text-decoration: none; text-transform: uppercase;
    }
    .btn:active { transform: translateY(1px); }
    .btn.ghost {
      border-color: var(--line); background: transparent; color: var(--mut);
      letter-spacing: 0.06em; text-transform: none; font-weight: 600;
    }
    .tiny {
      margin: 26px 0 0; font-size: 0.6rem; line-height: 1.6;
      color: var(--mut); opacity: 0.8;
    }
    .tiny b { color: var(--mut); font-weight: 700; }
    noscript p { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="mark">PINDUTAN</div>
    <div class="sub">the first runner · opens the arena</div>

    <div class="bar"><i id="bar"></i></div>

    <p class="line" id="line">Looking for the arena…</p>
    <p class="hint" id="hint" hidden></p>

    <div class="acts">
      <button class="btn" id="again" hidden>Try again</button>
      <a class="btn ghost" id="hosted" href="https://aidekupal.unaux.com/pindutan.html" hidden>Open the hosted copy</a>
    </div>

    <p class="tiny" id="tiny">
      This page holds no game code. It reads <b>labs/pindutan-build.json</b> on the
      <b>main</b> branch, then opens the arena that file names. The other two chairs
      are inside the arena, behind <b>☰ Games</b>.
    </p>
  </main>

  <noscript><p>Pindutan needs JavaScript. Turn it on, then reload this page.</p></noscript>

  <script>
  (function () {
    "use strict";

    var FEED = "https://raw.githubusercontent.com/gret521x-coder/Gretsanti/main/labs/pindutan-build.json";
    var ARENA = "https://raw.githubusercontent.com/gret521x-coder/Gretsanti/main/labs/pindutan-v21.html";
    var MIN_BYTES = 20000;

    var line = document.getElementById("line");
    var hint = document.getElementById("hint");
    var again = document.getElementById("again");
    var hosted = document.getElementById("hosted");
    var bar = document.getElementById("bar");

    function bust(url) {
      return url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
    }

    /* XHR second, for a browser that will not let a file:// page fetch */
    function viaXhr(url) {
      return new Promise(function (resolve, reject) {
        var x = new XMLHttpRequest();
        x.open("GET", bust(url), true);
        x.onload = function () {
          if (x.status >= 200 && x.status < 300) resolve(x.responseText);
          else reject(new Error("HTTP " + x.status));
        };
        x.onerror = function () { reject(new Error("network refused the request")); };
        try { x.send(); } catch (e) { reject(e); }
      });
    }

    function fetchText(url) {
      if (typeof fetch === "function") {
        return fetch(bust(url), { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        }).catch(function () { return viaXhr(url); });
      }
      return viaXhr(url);
    }

    function step(text, pct) {
      line.textContent = text;
      bar.style.width = pct + "%";
    }

    function fail(why) {
      bar.style.width = "100%";
      bar.classList.add("bad");
      line.textContent = "Could not open the arena.";
      hint.hidden = false;
      hint.textContent = (why || "no answer from the repo") +
        ". Check your signal and try again — the hosted copy still plays.";
      again.hidden = false;
      hosted.hidden = false;
    }

    function looksLikeArena(html) {
      return !!html && html.length >= MIN_BYTES &&
        html.indexOf("</html>") >= 0 && html.indexOf("SELF-UPDATE") >= 0;
    }

    /* an arena kept beside this page, for a copy uploaded by hand */
    function nearArena() {
      try { return new URL("pindutan-v21.html", location.href).href; } catch (e) { return ""; }
    }

    /* hand the whole page over to the deck */
    function run(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function load() {
      again.hidden = true;
      hosted.hidden = true;
      hint.hidden = true;
      bar.classList.remove("bad");
      step("Looking for the arena…", 14);

      var wanted = "";
      fetchText(FEED).then(function (raw) {
        var feed = {};
        try { feed = JSON.parse(raw) || {}; } catch (e) { feed = {}; }
        wanted = String(feed.build || "").trim();
        var url = (feed && feed.html) || ARENA;
        if (wanted) document.title = "Pindutan " + wanted + " — the first runner";
        step("Newest build: " + (wanted || "the arena") + " — opening it…", 46);
        return fetchText(url);
      }).then(function (html) {
        if (looksLikeArena(html)) { step("Starting " + (wanted || "the arena") + "…", 100); run(html); return true; }
        /* the repo copy is missing or broken: try the one beside this page */
        var near = nearArena();
        if (!near) throw new Error("the file that came back is not a whole game");
        step("Trying the arena beside this page…", 70);
        return fetchText(near).then(function (local) {
          if (!looksLikeArena(local)) throw new Error("the file that came back is not a whole game");
          step("Starting the arena…", 100);
          run(local);
          return true;
        });
      }).catch(function (e) {
        fail(String((e && e.message) || e));
      });
    }

    again.addEventListener("click", load);
    load();
  })();
  </script>
</body>
</html>
