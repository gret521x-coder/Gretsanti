<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KDL // LABS</title>
<style>
    :root{
        --bg-void:#000;
        --bg-panel:#08090b;
        --bg-card:#0d0f13;
        --border-line:#1f242d;
        --text-primary:#e6edf3;
        --text-dim:#7d8794;
        --accent-cyan:#38bdf8;
        --status-nominal:#00e676;
        --status-warn:#ffb020;
        --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        background:var(--bg-void);color:var(--text-primary);
        font-family:var(--font-mono);min-height:100vh;
        padding:clamp(20px,5vw,56px);
        line-height:1.55;
        background-image:radial-gradient(ellipse at 50% -20%, rgba(56,189,248,.10), transparent 60%);
        background-repeat:no-repeat;
    }
    a{color:inherit;text-decoration:none}
    header{border-bottom:1px solid var(--border-line);padding-bottom:18px;margin-bottom:26px}
    .eyebrow{
        display:inline-flex;align-items:center;gap:8px;font-size:.66rem;letter-spacing:.22em;
        color:var(--accent-cyan);text-transform:uppercase;margin-bottom:10px;
    }
    .dot{width:6px;height:6px;border-radius:50%;background:var(--status-nominal);box-shadow:0 0 8px var(--status-nominal)}
    h1{font-size:clamp(1.5rem,4.5vw,2.1rem);letter-spacing:.14em;font-weight:600}
    .sub{color:var(--text-dim);font-size:.78rem;margin-top:8px;max-width:60ch}

    .grid{
        display:grid;gap:14px;margin-top:8px;
        grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    }
    .card{
        display:block;background:var(--bg-card);border:1px solid var(--border-line);border-radius:12px;
        padding:16px 16px 14px;position:relative;overflow:hidden;
        transition:border-color .16s ease, transform .16s ease, background .16s ease;
    }
    .card:hover,.card:focus-visible{border-color:rgba(56,189,248,.5);transform:translateY(-2px);outline:none}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .card h2{font-size:.95rem;font-weight:600;letter-spacing:.02em}
    .tag{
        font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
        border:1px solid var(--border-line);color:var(--text-dim);white-space:nowrap;
    }
    .tag.live{color:var(--status-nominal);border-color:rgba(0,230,118,.35)}
    .tag.wip{color:var(--status-warn);border-color:rgba(255,176,32,.35)}
    .tag.idea{color:var(--accent-cyan);border-color:rgba(56,189,248,.35)}
    .card p{color:var(--text-dim);font-size:.74rem;margin-top:8px}
    .card .open{
        display:inline-block;margin-top:12px;font-size:.66rem;letter-spacing:.16em;
        color:var(--accent-cyan);text-transform:uppercase;
    }

    .empty{
        border:1px dashed var(--border-line);border-radius:12px;padding:34px 22px;text-align:center;
        color:var(--text-dim);font-size:.8rem;
    }
    .empty b{display:block;color:var(--text-primary);font-size:.9rem;margin-bottom:8px;letter-spacing:.06em}
    .empty code{color:var(--accent-cyan);font-size:.74rem}

    footer{
        margin-top:34px;padding-top:16px;border-top:1px solid var(--border-line);
        color:var(--text-dim);font-size:.68rem;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;
    }
    footer a{border-bottom:1px dotted var(--border-line)}
    footer a:hover{color:var(--accent-cyan);border-color:var(--accent-cyan)}
    @media (prefers-reduced-motion: reduce){ .card{transition:none} .card:hover{transform:none} }
</style>
</head>
<body>
<header>
    <span class="eyebrow"><span class="dot"></span>experimental build area</span>
    <h1>K D L &nbsp;//&nbsp; L A B S</h1>
    <p class="sub">Work in progress lives here, away from the shipped pages. Nothing in this folder is
       part of the live launcher until it graduates.</p>
</header>

<main id="grid" class="grid" aria-label="Experiments"></main>

<footer>
    <span id="count">0 experiments</span>
    <a href="../index-v5.html">&larr; back to mission control</a>
</footer>

<script>
/* ---------------------------------------------------------------------------
   Add an experiment by appending one object here. `file` is relative to this
   folder; leave it out while the idea is still on paper.
   status: 'live' | 'wip' | 'idea'
   ------------------------------------------------------------------------- */
var EXPERIMENTS = [
    {
        title: 'Pindutan — the newest build',
        href: '../pindutan-run.html',
        status: 'live',
        note: 'No game code in this one. It reads labs/pindutan-build.json on the main branch and then loads whatever build that file names, so it is always the newest game in the repo — keep this one file on your phone and it never goes stale. If the repo cannot be reached it says so and offers the hosted copy instead.'
    },
    {
        title: 'Pindutan v21',
        file: 'pindutan-v21.html',
        status: 'live',
        note: 'The build that keeps itself current. Open it — hosted or from your own storage — and it reads a tiny build file on GitHub main; if that names something newer it runs that instead, so nothing is ever uploaded twice. A hosted copy jumps to the new page (same address, same name, same crown, same ladder); a copy on your phone has the newer page written over itself, after letting go of its relays, its lobby channel and its timers first. With no signal, or a half download, it simply plays the copy it has. Everything from v20 is here unchanged: the name gate, the hall of fame, the GLIDE panel, the two lamp pills (Kupal / Intermediate) that play your own board in a 1v1, a group battle and against the CPU, and the three CPU levels that no longer play alike.'
    },
    {
        title: 'Pindutan v20',
        file: 'pindutan-v20.html',
        status: 'wip',
        note: 'Previous build. The name gate and the hall of fame. You still type the password, then you must give a nickname — refuse and you start again at the password. Wins and best scores from human battles only (1v1 and group) go on a ladder kept on aidekupal.unaux.com by api-leaderboard.php; solo and VS CPU never count. A GLIDE panel sets how a held button moves: five presets (Relaxed, Smooth, Fast, Pro, Snap) and sliders for start delay, glide speed, slide look and soft-drop speed, remembered on that phone. Two small pills sit right after RELAY, each a green dot then K or I — and whoever you press plays your board: Kupal's brain or the Intermediate one; press the lit one again to take your hands back. It works in a 1v1, a group battle and against the CPU — solo stays yours. From v20.8 you upload it once: it opens by reading a tiny build file on GitHub main and updating itself to whatever is newest. They are honestly different: Beginner taps slowest and settles for lesser spots, Intermediate is brisk and leaves the odd hole, Kupal is two pieces ahead and barely waits. Everything else is v17: the block wordmark, the one lobby, the live opponent boards.'
    },
    {
        title: 'Pindutan v17',
        file: 'pindutan-v17.html',
        status: 'wip',
        note: 'Previous build. The same game wearing its new coat: the PINDUTAN wordmark is drawn out of coloured blocks, the background is a dot grid, every player in the lobby gets a tetromino avatar with a CHALLENGE pill, and the four games are big 2x2 cards (SOLO, VS CPU, 1V1, GROUP) over a wide amber invite button. Engine, rooms and CPU unchanged from v16.'
    },
    {
        title: 'Pindutan v16',
        file: 'pindutan-v16.html',
        status: 'wip',
        note: 'Older build, kept as the tested copy. One lobby for everyone — no room codes, nothing to type. You open the game and you are already in, over four paths at once: local tabs, plus three free public relays (EMQX, HiveMQ, Mosquitto) over secure WebSockets, so no PHP and no server to upload. Everyone in the lobby picks their own game (solo, VS CPU, or a human), taps ⚔ 1v1 on any name to challenge them, or invites the whole lobby into a group battle. The CPU rival plays its own board, stacks, clears lines and fires garbage at you, in three levels — Beginner, Intermediate and Kupal (two pieces of lookahead, faster hands, one extra row on every attack).'
    },
    {
        title: 'Pindutan v15',
        file: 'pindutan-v15.html',
        status: 'wip',
        note: 'Neon block arena rework of pindutan.html. Slide-and-settle lock delay, a three-piece preview, T-spins, back-to-back and perfect clears, and the PINDUTAN charge burst that clears your bottom two rows — or cancels five incoming and fires five back in a room. Solo, 1v1 and 7-player group battles plus the live watcher still run on the same room codes as v14.'
    },
    {
        title: 'Call Spider (one file)',
        file: 'call-spider.html',
        status: 'live',
        note: 'Open it, paste the transcript, get notes. No install. Live capture works from a snippet you paste into the transcript tab.'
    },
    {
        title: 'Fortress',
        file: 'fortress.html',
        status: 'live',
        note: 'Zombies, orcs, goblin bombers, dark knights, brutes and a boss walk a road to your keep. Four towers — archer, warrior barracks, mage, catapult — go on the stone pads and each one forks at level 4 (Rangers Hideout or Frost Archers, Holy Order or Barbarian Hall, Pyromancer or Sorcerer, Big Bertha or Tesla x104); tap a tower for its panel: upgrade, pick a path, target priority. Seven heroes on cards — Gerald, Alleria, Malik, Bolin, Magnus, Ignus and Denas — pick three before each stage and each brings their own skill, plus a militia spell. Three stages — The Old Road, Two Rivers and The Long Way — with 3, 4 and 5 waves, each on its own road. Art lives in labs/assets/fortress.'
    },
    {
        title: 'Castle Defense',
        file: 'castle-defense.html',
        status: 'live',
        note: 'A winding road from the gate at the bottom to your castle at the top. Five unit cards, five levels, twenty lives. Tap the road to place a soldier; they march out to meet whoever is coming.'
    },
    {
        title: 'Call Spider (extension)',
        href: 'https://github.com/gret521x-coder/Gretsanti/blob/arena/aa77ad27-gretsanti/labs/transcript-spider/README.md',
        status: 'idea',
        note: 'Same spider as a Chrome extension — needs Developer mode, so the one-file version is the easier road.'
    },
    {
        title: 'Auto Clicker (Android)',
        href: 'https://github.com/gret521x-coder/Gretsanti/releases/tag/apk-latest',
        status: 'wip',
        note: 'Taps the screen for Clash of Clans. Step 1: the app opens. Tap here, then download the APK.'
    }
];

(function () {
    'use strict';

    var grid = document.getElementById('grid');
    var count = document.getElementById('count');

    if (!EXPERIMENTS.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<b>No experiments yet</b>' +
            'Add one to <code>labs/index.html</code> &mdash; one object in <code>EXPERIMENTS</code> ' +
            'and a file next to it.';
        grid.appendChild(empty);
        count.textContent = '0 experiments';
        return;
    }

    EXPERIMENTS.forEach(function (exp) {
        var href = exp.href || exp.file;
        var card = document.createElement(href ? 'a' : 'div');
        card.className = 'card';
        if (href) card.href = href;
        if (exp.href) { card.target = '_blank'; card.rel = 'noopener'; }

        var top = document.createElement('div');
        top.className = 'card-top';

        var h2 = document.createElement('h2');
        h2.textContent = exp.title || 'Untitled';

        var tag = document.createElement('span');
        var status = exp.status === 'live' || exp.status === 'wip' || exp.status === 'idea' ? exp.status : 'idea';
        tag.className = 'tag ' + status;
        tag.textContent = status;

        top.appendChild(h2);
        top.appendChild(tag);
        card.appendChild(top);

        if (exp.note) {
            var note = document.createElement('p');
            note.textContent = exp.note;
            card.appendChild(note);
        }

        if (href) {
            var open = document.createElement('span');
            open.className = 'open';
            open.textContent = 'Open \u2192';
            card.appendChild(open);
        }

        grid.appendChild(card);
    });

    count.textContent = EXPERIMENTS.length + (EXPERIMENTS.length === 1 ? ' experiment' : ' experiments');
})();
</script>
</body>
</html>
