plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gret.autoclicker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gret.autoclicker'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-step1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
