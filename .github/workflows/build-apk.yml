name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'labs/autoclicker/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: labs/autoclicker
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        working-directory: labs/autoclicker
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/autoclicker-step1.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: labs/autoclicker/artifacts/autoclicker-step1.apk
          if-no-files-found: error
